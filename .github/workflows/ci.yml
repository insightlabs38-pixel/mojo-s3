name: native-mojo
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  unit-and-local-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compiler and native libraries
        run: |
          python -m pip install mojo==1.1.0
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
      - name: Build, format, fixture and failure tests
        run: scripts/check
      - name: Clean source archive and installed-consumer check
        run: scripts/check-release
      - name: Start pinned local MinIO
        run: |
          curl --fail --location https://github.com/minio/minio/releases/download/RELEASE.2025-04-22T22-12-26Z/minio_20250422221226.0.0_amd64.deb -o /tmp/minio.deb
          dpkg-deb -x /tmp/minio.deb /tmp/minio
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=mojo-ci-access MINIO_ROOT_PASSWORD=mojo-ci-secret /tmp/minio/usr/local/bin/minio server /tmp/minio-data --address 127.0.0.1:19001 --console-address 127.0.0.1:19002 > /tmp/minio.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19001/minio/health/ready; then exit 0; fi
            sleep 1
          done
          cat /tmp/minio.log
          exit 1
      - name: Create isolated bucket and streaming fixture
        run: |
          python -m pip install boto3==1.43.108
          python - <<'PY'
          import boto3
          client=boto3.client('s3',endpoint_url='http://127.0.0.1:19001',aws_access_key_id='mojo-ci-access',aws_secret_access_key='mojo-ci-secret',region_name='us-east-1')
          client.create_bucket(Bucket='mojo-ci-test')
          client.create_bucket(Bucket='mojo-ci-versioned')
          client.put_bucket_versioning(Bucket='mojo-ci-versioned',VersioningConfiguration={'Status':'Enabled'})
          PY
          python scripts/generate_transfer_fixture.py /tmp/mojo-source.bin
      - name: Native contracts, streaming, multipart and interoperability
        env:
          S3_ENDPOINT: http://127.0.0.1:19001
          S3_REGION: us-east-1
          S3_ACCESS_KEY: mojo-ci-access
          S3_SECRET_KEY: mojo-ci-secret
          S3_TEST_BUCKET: mojo-ci-test
          S3_VERSIONED_TEST_BUCKET: mojo-ci-versioned
          S3_STREAM_SOURCE: /tmp/mojo-source.bin
          S3_STREAM_DESTINATION: /tmp/mojo-destination.bin
        run: |
          for test in integration streaming multipart_integration concurrent_integration transfers_integration checksums_integration interop data_plane_integration downloads_integration controlled_upload multipart_extra_integration tag_versions_integration; do
            scripts/build "tests/test_${test}.mojo" "build/test_${test}"
          done
          build/test_integration
          build/test_streaming
          build/test_multipart_integration
          build/test_concurrent_integration
          build/test_transfers_integration
          build/test_checksums_integration
          build/test_data_plane_integration
          build/test_downloads_integration
          build/test_controlled_upload
          build/test_multipart_extra_integration
          build/test_tag_versions_integration
          python scripts/session_credentials.py "$PWD/build/test_integration" "$PWD/build/test_concurrent_integration"
          python scripts/interop.py "$PWD/build/test_interop"
          python scripts/stress.py "$PWD/build/test_integration"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Build pinned ZEROS3 compatibility server
        run: |
          curl --fail --location https://raw.githubusercontent.com/insightlabs38-pixel/zeros3/f391b7e552f654f59ec23e3f46fadf3f60c1d97d/zeros3.go -o /tmp/zeros3.go
          go build -o /tmp/zeros3 /tmp/zeros3.go
          /tmp/zeros3 serve -addr 127.0.0.1:19003 -store /tmp/zeros3-data -access-key mojo-ci-access -secret-key mojo-ci-secret -vhost-base localhost > /tmp/zeros3.log 2>&1 &
          python - <<'PY'
          import boto3, time
          from botocore.exceptions import EndpointConnectionError
          c=boto3.client('s3',endpoint_url='http://127.0.0.1:19003',aws_access_key_id='mojo-ci-access',aws_secret_access_key='mojo-ci-secret',region_name='us-east-1')
          for attempt in range(30):
              try:
                  c.create_bucket(Bucket='mojo-ci-test')
                  break
              except EndpointConnectionError:
                  time.sleep(1)
          else:
              raise RuntimeError('ZEROS3 startup failed')
          PY
      - name: ZEROS3 common/extended contracts, concurrency and TLS
        env:
          S3_ENDPOINT: http://127.0.0.1:19003
          S3_REGION: us-east-1
          S3_ACCESS_KEY: mojo-ci-access
          S3_SECRET_KEY: mojo-ci-secret
          S3_TEST_BUCKET: mojo-ci-test
          S3_STREAM_SOURCE: /tmp/mojo-source.bin
          S3_STREAM_DESTINATION: /tmp/mojo-zeros3-destination.bin
        run: |
          scripts/build tests/test_extended_keys.mojo build/test_extended_keys
          scripts/build tests/test_vhost_tls.mojo build/test_vhost_tls
          build/test_integration
          build/test_streaming
          build/test_multipart_integration
          build/test_concurrent_integration
          build/test_transfers_integration
          build/test_extended_keys
          build/test_data_plane_integration
          build/test_downloads_integration
          build/test_controlled_upload
          python scripts/interop.py "$PWD/build/test_interop"
          python scripts/run_vhost_tls.py /tmp/zeros3 "$PWD/build/test_vhost_tls"
      - name: AddressSanitizer concurrency failure checks
        run: |
          scripts/build tests/test_concurrent_failures.mojo build/test_concurrent_asan --sanitize address
          python scripts/run_fault_tests.py "$PWD/build/test_concurrent_asan"
          scripts/build tests/test_download_faults.mojo build/test_download_asan --sanitize address
          python scripts/run_download_faults.py "$PWD/build/test_download_asan"
          scripts/build tests/test_controlled_upload.mojo build/test_controlled_upload_asan --sanitize address
          S3_ENDPOINT=http://127.0.0.1:19001 S3_REGION=us-east-1 S3_ACCESS_KEY=mojo-ci-access S3_SECRET_KEY=mojo-ci-secret S3_TEST_BUCKET=mojo-ci-test S3_STREAM_SOURCE=/tmp/mojo-source.bin build/test_controlled_upload_asan

          for pair in multipart_api_faults:run_multipart_api_faults.py assume_role:run_assume_role_fixtures.py large_stream:run_large_stream.py late_cancel:run_late_cancel.py; do
            test="${pair%%:*}"
            runner="${pair#*:}"
            scripts/build "tests/test_${test}.mojo" "build/test_${test}_asan" --sanitize address
            S3_CHECK_STREAM_RSS=0 python "scripts/$runner" "$PWD/build/test_${test}_asan"
          done
