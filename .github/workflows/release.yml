name: source-release-dry-run
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    uses: ./.github/workflows/ci.yml
  source-artifact:
    needs: qualification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned compiler and native development libraries
        run: |
          python -m pip install mojo==1.1.0
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
      - name: Clean install and reproducible source artifact
        run: scripts/release-dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: mojo-s3-source-dry-run
          path: build/release/
          retention-days: 30
